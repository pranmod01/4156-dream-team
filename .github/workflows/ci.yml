# AI-generated (Claude Code, Claude Opus 5.5)
# Builds and tests on every push and PR. `verify` runs Checkstyle
# (validate phase), unit tests + JaCoCo report (test phase), and PMD
# (verify phase). Reports are uploaded even when the build fails.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build, test, and run static analysis
        run: ./mvnw -B verify

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            target/site/jacoco/
            target/checkstyle-result.xml
            target/pmd.xml
            target/surefire-reports/
          if-no-files-found: ignore
